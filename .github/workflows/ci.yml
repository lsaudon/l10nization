name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          cache: npm

      - run: npm ci

      - run: npm run check-format

      - run: npm run check-lint

      - run: npm test -- --run
